[project]
name = "loyallens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=4.57",
    "trl",
    "peft",
    "datasets",
    "accelerate",
    "bitsandbytes",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["markdown"]  # scripts/make_pdf.py (Markdown->HTML; PDF via weasyprint CLI)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
