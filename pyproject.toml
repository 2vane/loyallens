[project]
name = "loyallens"
version = "0.1.0"
requires-python = ">=3.11"
# Detection harness only — the deps the public probe/PXR/audit code needs.
dependencies = [
    "torch",
    "transformers>=4.57",
    "peft",
    "scikit-learn",
    "scipy",
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["markdown"]  # scripts/make_pdf.py (Markdown->HTML; PDF via weasyprint CLI)
train = ["trl", "datasets", "accelerate", "bitsandbytes"]  # withheld installation recipe only

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
